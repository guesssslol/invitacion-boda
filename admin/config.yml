backend:
  name: git-gateway
  branch: main # Si tu rama principal en GitHub se llama "master", cambia main por master

media_folder: "images"
public_folder: "/images"

collections:
  - name: "invitacion"
    label: "Contenido de la Invitación"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "index"
        fields:
          - {label: "Foto de Portada", name: "portada", widget: "image"}
          - {label: "Nombre Novia", name: "novia", widget: "string", default: "Karla"}
          - {label: "Nombre Novio", name: "novio", widget: "string", default: "Erick"}
          - {label: "Fecha Texto", name: "fecha_texto", widget: "string", default: "Sábado | 27 Febrero 2027"}
          - {label: "Lugar Ceremonia", name: "ceremonia_lugar", widget: "string", default: "Parroquia De San Pedro Apóstol"}
          - {label: "Hora Ceremonia", name: "ceremonia_hora", widget: "string", default: "3:30 pm"}
          - {label: "Lugar Recepción", name: "recepcion_lugar", widget: "string", default: "Salon Jardin Frison"}
          - {label: "Hora Recepción", name: "recepcion_hora", widget: "string", default: "6:00 pm"}
          - {label: "Número de WhatsApp", name: "whatsapp_num", widget: "string", default: "525500000000"}
